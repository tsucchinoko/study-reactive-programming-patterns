schema:
  - internal/infrastructure/graphql/schema.graphql

exec:
  filename: internal/infrastructure/graphql/generated/generated.go
  package: generated

model:
  filename: internal/infrastructure/graphql/generated/models_gen.go
  package: generated

resolver:
  layout: follow-schema
  dir: internal/infrastructure/graphql
  package: graphql
  filename_template: "{name}.resolvers.go"

autobind: []

models:
  DateTime:
    model:
      - github.com/99designs/gqlgen/graphql.Time
